enable_native_execution_engine: false
driver_cores: 8
driver_memory: 56g
executor_cores: 8
executor_memory: 56g
dynamic_executor_allocation:
  enabled: true
  min_executors: 1
  max_executors: 9
spark_conf:
  spark.databricks.delta.optimizeWrite.enabled: true
  spark.microsoft.delta.targetFileSize.adaptive.enabled: true
  spark.sql.adaptive.enabled: true
  spark.sql.adaptive.coalescePartitions.enabled: true
  spark.sql.parquet.vorder.default: false
  spark.sql.parquet.filter.columnindex.enabled: false
  spark.databricks.delta.optimize.repartition.enabled: false
  spark.databricks.delta.optimize.maxThreads: 4
  spark.databricks.delta.optimize.maxFileSize: 268435456
runtime_version: 1.3
