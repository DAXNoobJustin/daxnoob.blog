# Framework contract — DiscoverQuestions UDF.
#
# Cross-model assertion: the UDF returns a single-row scalar response without
# erroring. We do NOT assert on the prose content (e.g. "Total questions:")
# here — that string is part of the UDF's English copy and would couple every
# model's CI to UDF wording. Per-model catalogs add stronger assertions on
# specific question IDs (e.g. semantic_model_tests/azure_data_insights/unit/discover_questions.yml).
cases:
  - id: framework_questions_empty_search_returns_scalar
    description: DiscoverQuestions("") returns a single-row scalar without erroring.
    category: structural
    dax: 'EVALUATE { Local.AskADIA.DiscoverQuestions("") }'
    expected_row_count:
      exact: 1

  - id: framework_questions_no_match_returns_scalar
    description: DiscoverQuestions with nonsense term still returns a single-row scalar (no crash).
    category: structural
    dax: 'EVALUATE { Local.AskADIA.DiscoverQuestions("__zzz_no_such_question__") }'
    expected_row_count:
      exact: 1
